# Upstream configurations
upstream ui_backend {
    server post_management.ui:80;
    keepalive 32;
}

upstream api_backend {
    server post_management.api:5000;
    keepalive 32;
}

# Cache configuration
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name localhost your-domain.com;  # Replace with your actual domain

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Remove server tokens for security
    server_tokens off;

    # Rate limiting for API endpoints
    location /api/auth/ {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
    }

    # API endpoints with caching
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        
        # Cache configuration for GET requests
        proxy_cache api_cache;
        proxy_cache_valid 200 301 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        
        # Skip cache for POST/PUT/DELETE
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $request_method;
        
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
        
        # Special handling for file uploads
        if ($request_uri ~* "/api/images") {
            client_max_body_size 50M;
            proxy_request_buffering off;
        }
    }

    # Serve static files with long-term caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://ui_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Angular application
    location / {
        proxy_pass http://ui_backend;
        include /etc/nginx/conf.d/proxy_headers.conf;
        
        # Don't cache HTML files
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            proxy_pass http://ui_backend;
        }
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(htaccess|htpasswd|ini|log|sh|sql|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}